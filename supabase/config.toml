# Local Supabase CLI configuration. Run `supabase start` from the repo root
# after installing the Supabase CLI (see README.md). This gives you local
# Postgres + Auth + Storage; Prisma (in packages/db) owns schema migrations
# against that same Postgres instance — see supabase/README.md.
project_id = "layo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:19006"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
